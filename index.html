<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class FYB Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <p class="year" id="year"></p>
  <h1 id="title">Class FYB</h1>
  <p class="sub" id="sub"></p>
  <label class="btn" for="file">Add your photos</label>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <p class="note">Photos appear in the gallery after the class admin approves them.</p>
  <p class="status" id="status" role="status"></p>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No photos yet. Be the first to add one.</p>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="close" id="close" aria-label="Close">&times;</button>
  <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
  <img id="big" alt="">
  <button class="nav next" id="next" aria-label="Next">&#8250;</button>
</div>

<script src="script.js"></script>
</body>
</html>
